[package]
name = "ihs"
version = "0.1.0"
edition = "2024"
description = "ihs - images hold secrets. A micro CLI tool that lets users hide and reveal data in PNG files, while remaining identical to the eye."
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
